[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffsim"
version = "0.1.0"
description = "Monte Carlo championship-probability engine for Sleeper fantasy football leagues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.5",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ffsim = "ffsim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ffsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Sleeper API (set FFSIM_LIVE_LEAGUE to enable)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
